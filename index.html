<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="display">

    </div>
    <div class="numberpad">
        <button id="btn-ac">AC</button>
        <button id="btn-clear">C</button>
        <button id="btn-flip">+/-</button>
        <button id="btn-div">÷</button>

        <button id="btn-one">1</button>
        <button id="btn-two">2</button>
        <button id="btn-three">3</button>
        <button id="btn-mul">×</button>

        <button id="btn-four">4</button>
        <button id="btn-five">5</button>
        <button id="btn-six">6</button>
        <button id="btn-sum">+</button>

        <button class="btn-seven">7</button>
        <button class="btn-eight">8</button>
        <button class="number-nine">9</button>
        <button id="btn-sub">-</button>

        <button id="btn-dec">.</button>
        <button class="number-zero">0</button>
        <button id="btn-res">=</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
